name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Le serveur tourne sous Windows au cabinet et se développe sous
        # macOS : les deux sont couverts, et Linux sert de référence.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']
        exclude:
          - os: macos-latest
            python: '3.9'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # cryptography ne sert qu'à fabriquer les certificats, donc uniquement
      # aux tests. Le serveur lui-même n'a aucune dépendance.
      - name: Install certificate tooling
        run: python -m pip install --upgrade pip cryptography

      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      # La file d'attente des dépôts vit dans le navigateur : les tests
      # Python s'arrêtent au serveur et ne la couvrent pas.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run form tests
        run: node tests/test_file_depots.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install linters
        run: python -m pip install --upgrade pip pyflakes

      - name: Check for unused imports and undefined names
        run: python -m pyflakes serveur/ tests/

      - name: Check that no secret is committed
        run: |
          set -e
          motif='\.pem$|autorite\.crt$|^config\.json$|^journal\.log|^bilans/'
          if git ls-files | grep -Ei "$motif"; then
            echo "::error::Un fichier sensible est versionné."
            exit 1
          fi
          echo "Aucun secret versionné."

      - name: Check that no contradictory licence notice remains
        run: |
          set -e
          motif='"license": *"MIT"|badge/licence-MIT|Permission is hereby granted, free of charge'
          # Les deux exclusions suivantes s'ajoutent aux trois du contrat : ce pas
          # scanne le contenu des fichiers (pas seulement leurs noms, à la
          # différence du contrôle des secrets ci-dessus), et deux fichiers du
          # dépôt portent eux-mêmes le motif en toutes lettres pour le définir —
          # ce pas lui-même, et son miroir Python en local.
          # Ancré des deux côtés : sans le `$`, un `TIERS.md.bak` porteur
          # d'une mention contradictoire aurait été exclu comme s'il était
          # TIERS.md — soit exactement le trou que ce pas doit fermer. Seul
          # `formulaire/lib/` reste un préfixe, puisqu'il désigne un dossier.
          exclus='^(LICENSE-MIT-HISTORIQUE|TIERS\.md|package-lock\.json|\.github/workflows/tests\.yml|tests/test_licence\.py)$|^formulaire/lib/'
          # `git ls-files -z` et non `git ls-files | tr` : sans `-z`, git
          # échappe les chemins non ASCII à la façon du C et les entoure de
          # guillemets. grep recevait alors un nom de fichier inexistant, et
          # un document accentué — ils le sont tous ici — porteur d'une
          # mention contradictoire passait le contrôle sans bruit.
          #
          # La boucle remplace un `xargs -0 grep`, qui rendait 123 aussi bien
          # pour « aucune correspondance » que pour une erreur réelle : les
          # deux cas étaient indistinguables, et un `|| true` les avalait.
          suivis=$(mktemp)
          trap 'rm -f "$suivis"' EXIT
          git ls-files -z > "$suivis"
          suspects=""
          while IFS= read -r -d '' fichier; do
            printf '%s\n' "$fichier" | grep -qE "$exclus" && continue
            if [ ! -f "$fichier" ]; then
              echo "::error::Chemin listé par git mais introuvable : $fichier"
              exit 1
            fi
            if grep -IqE "$motif" "$fichier"; then
              suspects="$suspects $fichier"
            fi
          done < "$suivis"
          if [ -n "$suspects" ]; then
            echo "::error::Mention de licence MIT contradictoire :$suspects"
            exit 1
          fi
          echo "Aucune mention de licence contradictoire."

  scripts-windows:
    # Les scripts d'installation ne tournent qu'au cabinet, sous Windows :
    # sans ce controle, une faute de syntaxe ne se decouvrirait que la-bas.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $echec = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $erreurs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$erreurs) | Out-Null
            if ($erreurs) {
              $echec = $true
              Write-Host "::error file=$($_.Name)::$($erreurs[0].Message)"
            } else {
              Write-Host "$($_.Name) : syntaxe correcte"
            }
          }
          if ($echec) { exit 1 }
