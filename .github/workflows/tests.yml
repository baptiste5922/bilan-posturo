name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Le serveur tourne sous Windows au cabinet et se développe sous
        # macOS : les deux sont couverts, et Linux sert de référence.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']
        exclude:
          - os: macos-latest
            python: '3.9'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # cryptography ne sert qu'à fabriquer les certificats, donc uniquement
      # aux tests. Le serveur lui-même n'a aucune dépendance.
      - name: Install certificate tooling
        run: python -m pip install --upgrade pip cryptography

      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      # La file d'attente des dépôts vit dans le navigateur : les tests
      # Python s'arrêtent au serveur et ne la couvrent pas.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run form tests
        run: node tests/test_file_depots.js

      - name: Run palette tests
        run: node tests/test_palette.js

      - name: Run form inventory tests
        run: node tests/test_inventaire_formulaire.js

      - name: Run rendering engine comparison tests
        run: node tests/test_comparaison_dom.js

      - name: Run engine start-up safety-net tests
        run: node tests/test_demarrage_moteur.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install linters
        run: python -m pip install --upgrade pip pyflakes

      - name: Check for unused imports and undefined names
        run: python -m pyflakes serveur/ tests/

      - name: Check that no secret is committed
        run: |
          set -e
          motif='\.pem$|autorite\.crt$|^config\.json$|^journal\.log|^bilans/'
          if git ls-files | grep -Ei "$motif"; then
            echo "::error::Un fichier sensible est versionné."
            exit 1
          fi
          echo "Aucun secret versionné."

      - name: Remind about the visual reference set's confidentiality
        run: |
          # Faible (audit C1-T3b) : docs/references-visuelles/ n'attend
          # encore que son LISEZMOI, mais les quatre fichiers à venir
          # (critère 1 du contrat C1-T3b) comprennent deux captures PNG
          # pleine page — onglets, barre de favoris, notifications. Un
          # refus pur et simple de tout fichier image serait prématuré
          # (ces fichiers DOIVENT un jour être versionnés) ; ce pas ne
          # bloque donc rien, il rappelle fort, dans un journal que
          # quiconque relit avant de fusionner.
          nouveaux=$(git ls-files docs/references-visuelles | grep -v '/LISEZMOI\.md$' || true)
          if [ -n "$nouveaux" ]; then
            echo "::warning::docs/references-visuelles/ contient des fichiers au-delà de LISEZMOI.md : relire le §4 de LISEZMOI.md (confidentialité des captures) avant toute fusion."
          fi

      - name: Check that the palette is not duplicated
        run: |
          set -e
          # Un fichier renommé ou déplacé ferait sortir grep en code 2 (erreur
          # de lecture, à distinguer du code 1 « aucune correspondance ») ; un
          # `|| true` placé en bout de pipe l'aurait avalé et laissé passer le
          # pas sans avoir rien vérifié. On vérifie donc l'existence d'abord,
          # fort et explicite, avant toute lecture.
          #
          # Faible (audit C1-T3b) : cette liste d'existence citait aussi
          # formulaire/index.html et formulaire/index-v1.html, alors que les
          # `grep` plus bas ne lisent jamais de fichier HTML — seulement
          # style.css, script.js et moteur/rendu.js. Un commentaire qui
          # affirme une couverture que la garde n'a pas est pire qu'un
          # commentaire absent : les deux fichiers HTML sont retirés d'ici,
          # et leur couverture (par exemple la pastille « Vert » du stylet,
          # formulaire/index.html, qui recopie en dur la couleur du token
          # `--titre`) reste un point non couvert, à reprendre dans une tâche
          # dédiée plutôt que de se prétendre réglée par une boucle qui ne
          # lit que des noms de fichiers.
          for fichier in formulaire/style.css formulaire/script.js formulaire/moteur/rendu.js; do
            if [ ! -f "$fichier" ]; then
              echo "::error::Fichier introuvable pour le contrôle de palette : $fichier"
              exit 1
            fi
          done

          motif='#(cec1a3|8c6d53|3b4133|3b523a|a39b8b)'
          # Ligne tolérée dans le CSS : une déclaration de token et rien
          # d'autre, commentaire de fin éventuel compris. Ancrée des deux
          # côtés : sans le `$` final, « --fond: #cec1a3; background:
          # #3B4133; » aurait été tolérée en entier à cause de son début
          # conforme, alors que la seconde couleur de la même ligne ne l'est
          # pas.
          tolere='^[0-9]+: *--[a-zA-Z-]+: *#[0-9a-fA-F]{3,8} *; *(/\*.*\*/)? *$'

          set +e
          sortie_css=$(grep -niE "$motif" formulaire/style.css)
          code_css=$?
          set -e
          if [ "$code_css" -gt 1 ]; then
            echo "::error::Erreur de lecture de formulaire/style.css."
            exit 1
          fi
          fautifs=""
          if [ "$code_css" -eq 0 ]; then
            fautifs=$(printf '%s\n' "$sortie_css" | grep -vE "$tolere" || true)
          fi

          # Dans le JS, ces couleurs ne sont tolérées nulle part : il lit les tokens.
          # formulaire/moteur/rendu.js est un second fichier JS de production
          # depuis C1-T3 : même règle, même absence de tolérance.
          for fichier_js in formulaire/script.js formulaire/moteur/rendu.js; do
            set +e
            sortie_js=$(grep -niE "$motif" "$fichier_js")
            code_js=$?
            set -e
            if [ "$code_js" -gt 1 ]; then
              echo "::error::Erreur de lecture de $fichier_js."
              exit 1
            fi
            if [ "$code_js" -eq 0 ]; then
              fautifs=$(printf '%s\n%s' "$fautifs" "$sortie_js")
            fi
          done

          if [ -n "$(printf '%s' "$fautifs" | tr -d '[:space:]')" ]; then
            echo "$fautifs"
            echo "::error::Couleur de palette écrite en dur hors des tokens de :root."
            exit 1
          fi

          # Apostrophes ou guillemets : les deux formes de style= en ligne
          # sont incompatibles avec la CSP à venir (C6-T1).
          for fichier_html in formulaire/index.html formulaire/index-v1.html; do
            if grep -nE "style=['\"]" "$fichier_html"; then
              echo "::error::Style en ligne dans $fichier_html : incompatible avec la CSP (C6-T1)."
              exit 1
            fi
          done
          echo "Palette non dupliquée."

      - name: Check that no contradictory licence notice remains
        run: |
          set -e
          motif='"license": *"MIT"|badge/licence-MIT|Permission is hereby granted, free of charge'
          # Les deux exclusions suivantes s'ajoutent aux trois du contrat : ce pas
          # scanne le contenu des fichiers (pas seulement leurs noms, à la
          # différence du contrôle des secrets ci-dessus), et deux fichiers du
          # dépôt portent eux-mêmes le motif en toutes lettres pour le définir —
          # ce pas lui-même, et son miroir Python en local.
          # Ancré des deux côtés : sans le `$`, un `TIERS.md.bak` porteur
          # d'une mention contradictoire aurait été exclu comme s'il était
          # TIERS.md — soit exactement le trou que ce pas doit fermer. Seul
          # `formulaire/lib/` reste un préfixe, puisqu'il désigne un dossier.
          # Les documents de la chaîne contrat → audit → revue citent ces
          # motifs en toutes lettres, puisqu'ils prescrivent et vérifient le
          # contrôle lui-même : un contrat qui exige « LICENSE ne doit plus
          # contenir cette phrase » doit écrire la phrase.
          exclus='^(LICENSE-MIT-HISTORIQUE|TIERS\.md|package-lock\.json|\.github/workflows/tests\.yml|tests/test_licence\.py)$|^formulaire/lib/|^docs/(contrats|audits|revues)/'
          # `git ls-files -z` et non `git ls-files | tr` : sans `-z`, git
          # échappe les chemins non ASCII à la façon du C et les entoure de
          # guillemets. grep recevait alors un nom de fichier inexistant, et
          # un document accentué — ils le sont tous ici — porteur d'une
          # mention contradictoire passait le contrôle sans bruit.
          #
          # La boucle remplace un `xargs -0 grep`, qui rendait 123 aussi bien
          # pour « aucune correspondance » que pour une erreur réelle : les
          # deux cas étaient indistinguables, et un `|| true` les avalait.
          suivis=$(mktemp)
          trap 'rm -f "$suivis"' EXIT
          git ls-files -z > "$suivis"
          suspects=""
          while IFS= read -r -d '' fichier; do
            printf '%s\n' "$fichier" | grep -qE "$exclus" && continue
            if [ ! -f "$fichier" ]; then
              echo "::error::Chemin listé par git mais introuvable : $fichier"
              exit 1
            fi
            if grep -IqE "$motif" "$fichier"; then
              suspects="$suspects $fichier"
            fi
          done < "$suivis"
          if [ -n "$suspects" ]; then
            echo "::error::Mention de licence MIT contradictoire :$suspects"
            exit 1
          fi
          echo "Aucune mention de licence contradictoire."

      - name: Check that cabinet identity is not copied into the schema documents
        run: |
          set -e
          # Les motifs sont dérivés de formulaire/index.html à l'exécution,
          # jamais écrits en dur : en cas d'échec, seul un nom de fichier et
          # un numéro de ligne *source* sont nommés, jamais le contenu, sans
          # quoi ce journal deviendrait lui-même le canal de fuite qu'il
          # doit empêcher.
          #
          # R3 (audit C1-T1, réaudit C1-T3) : la version précédente ancrait le
          # bloc d'identité sur des numéros de ligne figés (72-75) et ignorait
          # une ligne au texte vide par un simple `continue`, sans jamais
          # vérifier qu'il restait quelque chose à contrôler — une insertion de
          # lignes au-dessus du bloc rendait la garde muette, verte à vide,
          # plutôt qu'absente. Elle localise désormais le bloc par son ancre
          # `<section id="infos_podo">` … `</section>`, et échoue si cette
          # ancre est introuvable ou si aucune ligne de texte non vide n'en
          # est extraite.
          #
          # Constat moyen n°2 (audit C1-T3b) : la garde portait sur une liste
          # FERMÉE de cinq cibles, qui autorisait implicitement tout fichier
          # absent de la liste à recopier une coordonnée sans que rien ne s'en
          # aperçoive — c'est exactement ce qui est arrivé avec
          # tests/test_coquille.py (jamais ajouté à la liste) et, une fois,
          # avec un document de mises en échec (même défaut). Elle scanne
          # désormais TOUS les fichiers suivis par git, à l'exception de la
          # source elle-même et de sa copie gelée explicitement justifiée :
          # formulaire/index-v1.html, la fiche de secours, dont l'identité
          # recopiée est nécessaire (même en-tête que la production) et sous
          # garde d'empreinte SHA-256 séparée (tests/test_coquille.py) — ce
          # n'est pas un endroit où l'identité pourrait fuiter sans bruit,
          # c'est la source elle-même, répétée par nécessité.
          #
          # `git ls-files -z` et non `git ls-files | tr` : sans `-z`, git
          # échappe les chemins non ASCII à la façon du C et les entoure de
          # guillemets, et un document accentué — ils le sont tous ici —
          # porteur d'une mention contradictoire passerait sans bruit. La
          # boucle remplace un `xargs -0 grep`, qui rendrait 123 aussi bien
          # pour « aucune correspondance » que pour une erreur réelle.
          source="formulaire/index.html"
          exclus='^formulaire/index(-v1)?\.html$'
          if [ ! -f "$source" ]; then
            echo "::error::Fichier introuvable pour le contrôle d'identité du cabinet : $source"
            exit 1
          fi

          ancre_debut=$(grep -n '<section id="infos_podo">' "$source" | head -1 | cut -d: -f1)
          if [ -z "$ancre_debut" ]; then
            echo "::error::Ancre <section id=\"infos_podo\"> introuvable dans $source : la garde ne peut plus localiser le bloc d'identité."
            exit 1
          fi

          decalage_fin=$(tail -n "+$ancre_debut" "$source" | grep -n '</section>' | head -1 | cut -d: -f1)
          if [ -z "$decalage_fin" ]; then
            echo "::error::Balise fermante </section> introuvable après la ligne $ancre_debut de $source."
            exit 1
          fi
          ancre_fin=$((ancre_debut + decalage_fin - 1))

          set +e
          lignes_extraites=$(sed -n "${ancre_debut},${ancre_fin}p" "$source" |
            sed -E 's/<[^>]*>//g' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | grep -v '^$')
          set -e
          if [ -z "$lignes_extraites" ]; then
            echo "::error::Aucune ligne de texte non vide extraite de l'ancre <section id=\"infos_podo\"> ($source, lignes $ancre_debut-$ancre_fin) : la garde n'a plus rien à contrôler."
            exit 1
          fi

          fichier_lignes=$(mktemp)
          suivis=$(mktemp)
          trap 'rm -f "$fichier_lignes" "$suivis"' EXIT
          printf '%s\n' "$lignes_extraites" > "$fichier_lignes"
          git ls-files -z > "$suivis"

          fautifs=""
          while IFS= read -r -d '' fichier; do
            printf '%s\n' "$fichier" | grep -qE "$exclus" && continue
            if [ ! -f "$fichier" ]; then
              echo "::error::Chemin listé par git mais introuvable : $fichier"
              exit 1
            fi
            while IFS= read -r texte; do
              [ -z "$texte" ] && continue
              if grep -IqF -- "$texte" "$fichier"; then
                fautifs="$fautifs $fichier"
                break
              fi
            done < "$fichier_lignes"
          done < "$suivis"

          if [ -n "$fautifs" ]; then
            echo "::error::Coordonnée du cabinet recopiée, voir $source ligne(s) $ancre_debut-$ancre_fin, dans :$fautifs"
            exit 1
          fi
          echo "Aucune coordonnée du cabinet recopiée."

  scripts-windows:
    # Les scripts d'installation ne tournent qu'au cabinet, sous Windows :
    # sans ce controle, une faute de syntaxe ne se decouvrirait que la-bas.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $echec = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $erreurs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$erreurs) | Out-Null
            if ($erreurs) {
              $echec = $true
              Write-Host "::error file=$($_.Name)::$($erreurs[0].Message)"
            } else {
              Write-Host "$($_.Name) : syntaxe correcte"
            }
          }
          if ($echec) { exit 1 }
